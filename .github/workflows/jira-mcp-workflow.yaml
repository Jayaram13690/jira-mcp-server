name: Jira MCP Server — CI/CD (Container Apps)

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: jira-mcp-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: jira-mcp-server

jobs:
  ci:
    name: CI — Lint, Test, Security, Build Validation
    runs-on: ${{ vars.RUNNER_LABEL }} 
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run --with ruff ruff check .

      - name: Unit tests (pytest)
        run: uv run --with pytest pytest tests/ -v

      - name: Dependency vulnerability audit (pip-audit)
        run: |
          uv export --no-hashes --no-dev -o requirements.txt
          uv run --with pip-audit pip-audit -r requirements.txt

      - name: Secret scan (trufflehog)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  build:
    name: Build & push image
    needs: ci
    runs-on: ${{ vars.RUNNER_LABEL }}
    environment: dev
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute immutable tag
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify private DNS resolution to ACR
        run: |
          getent hosts ${{ vars.ACR_NAME }}.azurecr.io || true
          echo "Resolved ACR endpoint (expect a 10.x private IP above)"

      # Exchanges the deployment identity's Azure AD token for an
      # ACR access token — no admin-user credentials involved.
      - name: ACR login
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          provenance: false
          tags: |
            ${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:buildcache,mode=max

      # Scan the locally built image before it ever reaches ACR.
      # Fails the pipeline on HIGH/CRITICAL, so the push step below
      # never runs for a vulnerable image.
      - name: Scan image before push (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      # Only reached if the scan passed. Pushes the already-built,
      # already-scanned local image — no rebuild.
      - name: Push image to ACR
        run: |
          docker push ${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          docker push ${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

  deploy-dev:
    name: Deploy → dev
    needs: build
    runs-on: ${{ vars.RUNNER_LABEL }} # VNet-injected runner with ACR private-endpoint access
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App revision
        run: |
          az containerapp update \
            --name ${{ vars.CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --image ${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }} \
            --revision-suffix r${{ needs.build.outputs.image_tag }}

      # Poll the new revision until it reports Healthy; on timeout,
      # dump system logs and fail the job so a bad revision never
      # silently passes as "deployed".
      - name: Wait for revision to become healthy
        run: |
          for i in $(seq 1 30); do
            STATE=$(az containerapp revision list \
              -n ${{ vars.CONTAINER_APP_NAME }} -g ${{ vars.RESOURCE_GROUP }} \
              --query "[?properties.active].properties.healthState | [0]" -o tsv)
            echo "Revision health: ${STATE:-unknown}"
            [ "$STATE" = "Healthy" ] && exit 0
            sleep 10
          done
          echo "::error::Revision did not reach Healthy state"
          az containerapp logs show -n ${{ vars.CONTAINER_APP_NAME }} \
            -g ${{ vars.RESOURCE_GROUP }} --type system --tail 50
          exit 1
