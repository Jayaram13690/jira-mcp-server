[project]
name = "jira-mcp-server"
version = "1.0.0"
description = "Jira MCP server - unchanged from GCP, not ADK-specific code"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "mcp[cli]>=1.1.0",
    "starlette",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "azure-identity>=1.25.3",
    "httpx2>=2.13.0",
    "azure-appconfiguration-provider>=2.5.0",
    "agent-framework>=1.19.0",
    "agent-framework-foundry>=1.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff.lint]
# These require a judgment call about actual behavior (e.g. what to do on a
# caught exception, whether a broad exception assertion in a test is fine)
# rather than a mechanical rewrite, so they're left as warnings instead of
# blocking CI. Revisit case by case rather than fixing to satisfy the rule.
ignore = [
    "BLE001", # blind `except Exception`
    "E722",   # bare `except:`
    "B006",   # mutable default argument
    "B017",   # `assertRaises(Exception)` / `pytest.raises(Exception)`
    "SIM117", # nested `with` statements that could combine
    "F841",   # assigned but unused local variable
    "RUF013", # implicit `Optional` (e.g. `x: int = None`)
]
